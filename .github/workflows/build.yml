name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: |
          mkdir -p res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><input-method xmlns:android="http://schemas.android.com/apk/res/android" android:settingsActivity="com.example.kb.MainActivity"/>' > res/xml/method.xml
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-apk
          path: build/outputs/apk/debug/*.apk
